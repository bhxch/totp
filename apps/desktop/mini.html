<!doctype html>
<html lang="zh-CN">
  <head>
    <script>try{var p=JSON.parse(localStorage.getItem('themePref')||'{}'),d=document.documentElement.dataset;d.mode=p.mode||'auto';d.color=p.color||'blue';if(p.contrast)d.contrast=p.contrast}catch(e){document.documentElement.dataset.mode='auto';document.documentElement.dataset.color='blue'}</script>
    <!-- 首帧防闪：值与 tokens.css dark surface 一致，CSS 装载后由 --md-sys-color-background 接管；auto 随系统深色补同值 -->
    <style>html{background:#fff}html[data-mode='dark']{background:#1b1b1f}@media (prefers-color-scheme: dark){html[data-mode='auto']{background:#1b1b1f}}</style>
    <meta charset="UTF-8" />
    <title>TOTP</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mini.ts"></script>
  </body>
</html>
