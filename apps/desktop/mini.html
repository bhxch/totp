<!doctype html>
<html lang="zh-CN">
  <head>
    <script>try{var p=JSON.parse(localStorage.getItem('themePref')||'{}'),d=document.documentElement.dataset;d.mode=p.mode||'auto';d.color=p.color||'blue';if(p.contrast)d.contrast=p.contrast}catch(e){document.documentElement.dataset.mode='auto';document.documentElement.dataset.color='blue'}</script>
    <!-- dark 底色与 M3 暗色 surface 对齐（spec §2.3） -->
    <style>html{background:#fff}html[data-mode='dark']{background:#1c1b1f}</style>
    <meta charset="UTF-8" />
    <title>TOTP</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mini.ts"></script>
  </body>
</html>
