[package]
name = "totp-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "totp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools feature（验收条目4）：WebView 远程调试（release 构建也可经设置开启，默认关）
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
# B22 双实例启动 panic（E2E 2026-09-26）：主实例运行时启动第二实例，全局快捷键 ALT+SHIFT+T
# 已注册致 tauri_plugin_global_shortcut 初始化 panic（exit 101）。单实例判定在插件层：第二实例
# 干净退出（exit 0）并回调聚焦既有主窗；必须注册为第一个 plugin（官方要求，尽早退出）
tauri-plugin-single-instance = "2"
# 真机 E2E 基建：tauri-mcp 驱动 UI 用；Rust 侧 cfg(debug_assertions) 门控注册，release 不激活
tauri-plugin-mcp-bridge = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# F4 对话框授权 token 的 CSPRNG（tauri 传递依赖已在树中，不新增编译产物）
getrandom = "0.3"

# plan17：内嵌 MCP 服务器（Streamable HTTP）。rmcp 自带 tokio 栈与 tauri 2 同源；
# StreamableHttpService 为 Tower service，HTTP 挂载层（axum）由 plan17 Task 6 自备
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }

# plan17：MCP Streamable HTTP 挂载层（rmcp 的 StreamableHttpService 为 Tower service，需自备 HTTP 栈）
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# plan17：mcp_auth 中间件直接命名 http::request::Parts / http::header::*（rmcp/tauri 传递依赖已在树）
http = "1"

# plan17 Task 5：事件桥 oneshot 回传（sync）+ bridge_call 超时（time）。
# tauri/rmcp 已传递引入 tokio 1，同版本显式声明不新增编译产物；
# Task 6b 的 serve_forever 用 TcpListener（net）
tokio = { version = "1", features = ["sync", "macros", "time", "net"] }

# plan17 停机修复（审查 I-3）：rmcp StreamableHttpServerConfig.cancellation_token 的类型为
# tokio_util::sync::CancellationToken，stop_server 需 cancel 它终止 GET SSE 长连接；
# rmcp 传递依赖已在树（Cargo.lock 0.7），显式声明不新增编译产物（sync 模块无 feature 门控）
tokio-util = "0.7"

# plan17：mcp_router 装配辅助的泛型 bound 引用 tower::Service（审查 I-6）；
# tower 随 axum/rmcp 已在树（Cargo.lock 0.5），显式声明不新增编译产物
tower = "0.5"

# 云备份出网通道（2026-09-30 CORS/代理设计）：reqwest 天然无 CORS，替代 WebView fetch；
# 版本与 Cargo.lock 既有传递依赖 0.13.5 对齐避免重复编译。关 default features 仅取所需：
# rustls-no-provider（TLS：0.13 已移除公开 native-tls；选 ring provider 而非默认 aws-lc-rs
# 免 cmake/NASM 构建负担；platform-verifier 随 feature 带入，Windows 用系统证书库）+
# system-proxy（system 模式语义：hyper-util 读 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY）+
# socks（socks5(h) 代理）；http/1.1 恒开，不开 http2 免引 h2 树。base64 0.22 已在树
# （lock 0.22.1）不新增编译产物
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "system-proxy",
    "socks",
] }
# reqwest rustls-no-provider 的进程级 CryptoProvider：ring（预生成汇编，无 cmake/NASM 外部依赖）；
# std+tls12 与 reqwest 内部 hyper-rustls(http1,tls12) 对齐（老 WebDAV 服务器多停在 TLS1.2）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# DEK 与明文密钥内存清零（Global Constraints：DEK 缓冲用后即清）。必须放主依赖段：
# elevation_commands.rs 是 Tauri 命令层（generate_handler 不支持条目级 cfg，Linux 需编译运行时桩），
# 其 use zeroize::Zeroize 在 Linux clippy 下解析；放 cfg(windows) 段会 E0432（CI run 37631405475 实证）
zeroize = "1"

[dev-dependencies]
# plan17：mcp_auth_middleware 的 oneshot 直测（审查 I-6）需要 tower::ServiceExt（util feature，
# 仅测试构建生效，与上方主依赖特性叠加）
tower = { version = "0.5", features = ["util"] }

# DPAPI 解密（WinAuth 导入）+ 系统锁屏事件（plan16 T15，WTS 会话通知与隐藏窗口）：
# 仅 Windows 目标编译
[target.'cfg(windows)'.dependencies]
# 释放策略暂停档（批⑧ §7.3）：TrySuspend 暂停 WebView2 渲染进程活跃，底层调用
# ICoreWebView2_3::TrySuspend。tauri 2.12 传递依赖已要求 webview2-com ^0.39，显式声明
# 与之同源（0.39.1 内部走 windows-core 0.62）不新增编译产物
webview2-com = "0.39"
# 新增 feature 为 ABE 提权服务（plan p6 §0.1）：Services（SCM）/Pipes（命名管道）/
# Threading（进程句柄与事件等待）/Storage_FileSystem（ReadFile/WriteFile/PIPE_ACCESS_DUPLEX/
# FILE_FLAG_FIRST_PIPE_INSTANCE）/Security+Security_Authorization（SECURITY_ATTRIBUTES 与
# SDDL 转 DACL）/System_Registry（HKLM 绑定记录）/System_IO（OVERLAPPED 重叠 ConnectNamedPipe）。
# 版本 0.62 与 tauri 2.12 联动：tauri 2.12 传递依赖要求 webview2-com ^0.39 + windows ^0.62，
# webview2-com 0.39.1 内部 windows-core 0.62 与本表 windows 0.62 同源，Interface::cast 跨
# crate 可用；原"保持 0.61"决策基于 tauri 2.11 依赖树，随 2.12 联动推翻（0.62 元数据刷新
# 仅 WinRT 侧，Win32 签名无变化）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # 托盘 i18n（Phase 2 Task 7）：GetUserDefaultUILanguage——settings.locale='auto' 时托盘
    # 语言按系统 UI 语言判定（与前端 navigator.language 判定同语义）
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# ABE 提权服务 SCM 接入（plan p6 §0.1）：service_dispatcher + control handler；
# crate 自带 windows-sys 依赖，与上表 windows 互不影响
windows-service = "0.8"
# 调用者验证：SHA256(client exe 文件)（plan p6 §0.1；rs 调用方传入比对值，验证纯函数不落 IO）
sha2 = "0.10"
# UAC 单命令提权（plan p6 §0.2）：trigger_install 以 runas 拉起自身 --elevation-install
runas = "1.2"

# osAutoUnlock 统一通道（mac Keychain / linux Secret Service）：仅对应目标编译，Windows 构建不下载不编译
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "3"
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }


