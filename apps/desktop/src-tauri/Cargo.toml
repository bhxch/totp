[package]
name = "totp-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "totp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# F4 对话框授权 token 的 CSPRNG（tauri 传递依赖已在树中，不新增编译产物）
getrandom = "0.3"

# plan17：内嵌 MCP 服务器（Streamable HTTP）。rmcp 自带 tokio 栈与 tauri 2 同源；
# StreamableHttpService 为 Tower service，HTTP 挂载层（axum）由 plan17 Task 6 自备
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }

# plan17 Task 5：事件桥 oneshot 回传（sync）+ bridge_call 超时（time）。
# tauri/rmcp 已传递引入 tokio 1，同版本显式声明不新增编译产物
tokio = { version = "1", features = ["sync", "macros", "time"] }

# DPAPI 解密（WinAuth 导入）+ 系统锁屏事件（plan16 T15，WTS 会话通知与隐藏窗口）：
# 仅 Windows 目标编译
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# osAutoUnlock 统一通道（mac Keychain / linux Secret Service）：仅对应目标编译，Windows 构建不下载不编译
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "3"
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
