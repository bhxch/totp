<!doctype html>
<html lang="zh-CN">
  <head>
    <script>try{var p=JSON.parse(localStorage.getItem('themePref')||'{}'),d=document.documentElement.dataset;d.mode=p.mode||'auto';d.color=p.color||'blue';if(p.contrast)d.contrast=p.contrast}catch(e){document.documentElement.dataset.mode='auto';document.documentElement.dataset.color='blue'}</script>
    <!-- 首帧防闪：与 tokens.css 默认种子 light/dark surface 值一致 -->
    <style>html { background: #fefbff } html[data-mode='dark'] { background: #1b1b1f }</style>
    <meta charset="UTF-8" />
    <title>TOTP</title>
  </head>
  <body style="width: 360px; min-height: 480px; margin: 0">
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
