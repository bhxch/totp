# PR 门禁：前端 typecheck/test + Rust fmt/clippy/cargo test + 覆盖率 gate
#（coverage-web 四包阈值 / coverage-rust cargo-llvm-cov，coverage-design §5）。
# Linux 系统依赖与 build.yml 的 desktop-linux job 保持一致
#（ubuntu-24.04 已移除 libappindicator3-dev，用 libayatana-appindicator3-dev）。
name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6（= v6.1.0）
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6（= v6.1.0）
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6（= v6.5.0）
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # extension 的全局 API 类型（defineBackground 等）由 .wxt 生成且被 gitignore，
      # 干净环境 typecheck 前必须先 prepare
      - run: pnpm --filter @totp/extension exec wxt prepare
      - run: pnpm typecheck
      # 版本落点一致性自检：--check 不带版本参数，以 apps/desktop/package.json 为基准
      - run: node scripts/bump.mjs --check
      - run: pnpm test
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      # dtolnay/rust-toolchain 的 stable 是浮动分支，pin 到 2026-09-22 的分支 HEAD
      #（来源 api.github.com/repos/dtolnay/rust-toolchain/commits/stable）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable HEAD @ 2026-09-22
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2（annotated tag 解引用后的 commit）
        with: { workspaces: apps/desktop/src-tauri }
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
  coverage-web:
    # 前端覆盖率 gate：阈值在各包 vitest.config.ts 的 coverage.thresholds
    #（coverage-design §5，P6 开闸，实测 -0.5pp 边际，随改进收紧）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @totp/extension exec wxt prepare
      - run: pnpm run test:coverage
  coverage-rust:
    # Rust 覆盖率 gate。必须在 windows 上统计：cfg(windows) 代码（托盘/DPAPI/锁屏等）
    # 不参与 Linux 编译，Linux 口径与本地基线（Windows 实测）不可比。
    # windows runner 分钟数对公共仓库免费（项目 nightly 已在用 windows 构建），边际成本低；
    # 顺带补上「Windows 下 cargo test 全绿」的 CI 守护（此前仅 Linux，见 backlog 观察项）。
    runs-on: windows-latest
    timeout-minutes: 50 # 首跑无缓存全量编译 + 插桩开销约 20-30min，留余量
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      # dtolnay action 本体沿用 stable job 的 SHA pin；nightly 工具链逐日浮动，无法 pin
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable HEAD @ 2026-09-22
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with: { tool: cargo-llvm-cov }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: apps/desktop/src-tauri }
      # 原始口径 gate（2026-09-26 实测 71.56% lines / 54.69% branches，Branches 426 总量）
      # 减边际定值；豁免口径（排除 main.rs / lib.rs run() / lock_events.rs）为 73.50/58.75，
      # 设计目标 90/85 属豁免区结构性不可达，随 seam 抽取按豁免口径逐步收紧
      # （stable 下 rustc-wrapper 失效，恒用 --no-rustc-wrapper；本地同款命令见 coverage-design §2）
      - run: cargo llvm-cov --no-rustc-wrapper --branch --summary-only --fail-under-lines 71 --fail-under-branches 54
        working-directory: apps/desktop/src-tauri
