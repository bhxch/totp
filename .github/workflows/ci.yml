# PR 门禁：前端 typecheck/test + Rust fmt/clippy/cargo test。
# Linux 系统依赖与 build.yml 的 desktop-linux job 保持一致
#（ubuntu-24.04 已移除 libappindicator3-dev，用 libayatana-appindicator3-dev）。
name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（= v4.4.0）
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 版本落点一致性自检：--check 不带版本参数，以 apps/desktop/package.json 为基准
      - run: node scripts/bump.mjs --check
      - run: pnpm test
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      # dtolnay/rust-toolchain 的 stable 是浮动分支，pin 到 2026-09-22 的分支 HEAD
      #（来源 api.github.com/repos/dtolnay/rust-toolchain/commits/stable）
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable HEAD @ 2026-09-22
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2（annotated tag 解引用后的 commit）
        with: { workspaces: apps/desktop/src-tauri }
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
