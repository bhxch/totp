# 每日滚动构建：UTC 16:00（北京时间 0 点）定时 + 手动触发。
# 复用 build.yml 构建 main，产物带日期标签后缀，发布到固定 nightly prerelease
#（先删旧 release 与旧 tag，再由 softprops 重建 tag，避免旧 tag 残留导致
# softprops/action-gh-release 不移动已存在的 tag、release 永挂首日 commit）。
name: nightly
on:
  schedule: [{ cron: "0 16 * * *" }]   # UTC 16:00 = 北京 0 点
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with: { ref: main, suffix: nightly, nightly: true }
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8（= v8.0.1）
        with: { path: artifacts, merge-multiple: true }
      - name: sha256
        run: cd artifacts && sha256sum * > ../sha256sums.txt
      # schedule/dispatch 事件无 head_commit，body 用日期 + 短 sha 组装
      - name: Assemble release body
        run: echo "NIGHTLY_BODY=自动构建 $(date -u +%Y-%m-%d %H:%M UTC) @ ${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9（= v9.0.0，annotated tag 解引用后的 commit）
        with:
          script: |
            // 删除旧 nightly release 及其 tag（tag 由下方 softprops 步骤重建）
            const rel = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag: 'nightly' }).catch(() => null)
            if (rel) await github.rest.repos.deleteRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: rel.data.id })
            await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'refs/tags/nightly' }).catch(() => null)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: ${{ env.NIGHTLY_BODY }}
          files: |
            artifacts/*
            sha256sums.txt
