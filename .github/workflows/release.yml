# 正式发布流水线：push v* tag 触发。
# gate 校验 tag 与根 package.json version 一致；ci 复用 ci.yml 对 tag ref 全量重跑
#（分支保护 required checks 只对 branch 生效、tag 推送无法用仓库规则强制，
# 故 CI 门禁在此工作流内实现，见 gate 注释）。
# 复用 build.yml 全量构建，最后汇总产物 + sha256 清单发布 GitHub Release。
name: release
on:
  push: { tags: ["v*"] }

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - name: tag == 全部版本落点一致（bump --check）
        run: node scripts/bump.mjs "${GITHUB_REF_NAME#v}" --check
  ci:
    # 发布前置：对 tag 指向的 commit 重跑完整 CI（workflow_call 在调用方 ref 执行）
    uses: ./.github/workflows/ci.yml
  build:
    needs: [gate, ci]
    uses: ./.github/workflows/build.yml
    with: { ref: "${{ github.ref_name }}", suffix: release, nightly: false }
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8（= v8.0.1）
        with: { path: artifacts, merge-multiple: true }
      # desktop-linux 的 zip 内保留 deb/、appimage/ 子目录（两个 glob path 的
      # 最小公共父目录为 bundle/），先打平到顶层，供 sha256 与 release 上传的
      # artifacts/* 通配使用；各产物文件名互不冲突，打平安全
      - name: Flatten artifacts
        run: find artifacts -mindepth 2 -type f -exec mv -t artifacts {} + && find artifacts -mindepth 1 -type d -empty -delete
      - name: sha256
        run: cd artifacts && sha256sum * > ../sha256sums.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3（= v3.0.3，annotated tag 解引用后的 commit）
        with:
          files: |
            artifacts/*
            sha256sums.txt
          generate_release_notes: true
