# 正式发布流水线：push v* tag 触发。
# gate 校验 tag 与根 package.json version 一致后，复用 build.yml 全量构建，
# 最后汇总产物 + sha256 清单发布 GitHub Release。
name: release
on:
  push: { tags: ["v*"] }

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: tag == 全部版本落点一致（bump --check）
        run: node scripts/bump.mjs "${GITHUB_REF_NAME#v}" --check
  build:
    needs: gate
    uses: ./.github/workflows/build.yml
    with: { ref: "${{ github.ref_name }}", suffix: release, nightly: false }
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts, merge-multiple: true }
      - name: sha256
        run: cd artifacts && sha256sum * > ../sha256sums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*
            sha256sums.txt
          generate_release_notes: true
